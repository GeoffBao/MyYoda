# electron-builder 配置
# 文档: https://www.electron.build/configuration/configuration

appId: com.luxshare.myyoda
productName: MyYoda
copyright: Copyright © 2024-2026 Luxshare

# Electron 版本（CI 环境 bun workspace 下无法自动检测，需显式指定）
electronVersion: 43.2.0

# 目录配置
directories:
  output: out
  buildResources: resources

# 压缩配置
compression: normal

# ASAR 打包配置
# 启用 ASAR 归档，将 SDK native binary / Pi native addon 解压到 app.asar.unpacked/ 避免路径问题
asar: true
asarUnpack:
  - "node_modules/@silvia-odwyer/**"
  - "node_modules/@mariozechner/**"
  - "node_modules/@napi-rs/**"
  - "node_modules/@earendil-works/pi-tui/native/**"
  - "node_modules/sharp/**"
  - "node_modules/@img/**"

# 跳过 npm install（代码已被 esbuild/Vite 打包，npm 不识别 workspace:* 协议）
npmRebuild: false

# 通用文件配置
files:
  - dist/**/*
  # 排除 build:resources 脚本拷到 dist/resources 的副本（electron-builder 已通过
  # buildResources 从 resources/ 直接使用 icon/plist，避免产物里重复打包一份）
  - "!dist/resources/**"
  - package.json
  # Claude SDK 与 Pi runtime 均作为主进程 external 运行。打包前 sync:runtime-deps 会
  # 将 external 依赖闭包同步到 apps/electron/node_modules。
  - node_modules/**/*
  # 显式列出 Claude SDK 主包 + 平台子包（sync:check / 打包门禁要求）
  # PDF 内联预览使用本地 PDF.js 资源，避免运行时依赖 CDN。
  - node_modules/pdfjs-dist/**/*
  # 排除 workspace 包的 symlink（代码已被 esbuild/Vite 打包到 dist/ 中）
  - "!node_modules/@myyoda/**"
  # 排除明确只在开发/构建期使用的大体积包。
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/electronmon/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@electron/**"
  - "!node_modules/@electron-builder/**"
  - "!node_modules/@esbuild/**"
  # 排除 Pi SDK 纯演示/文档/sourcemap 内容，保留运行时必需文件。
  - "!node_modules/@earendil-works/*/examples/**"
  - "!node_modules/@earendil-works/*/docs/**"
  - "!node_modules/@earendil-works/**/*.map"

# 通用额外资源
extraResources:
  # myyoda CLI 自包含二进制（build:cli 用 bun build --compile 产出到 resources/bin/）。
  # 运行时由主进程注入 MYYODA_CLI 环境变量，暴露给 skill / Agent 调用。
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  # 默认 Skills 模板（首次启动时同步到 ~/.myyoda/default-skills/）
  - from: default-skills
    to: default-skills
    filter:
      - "**/*"
  # 默认专家模板（首次启动时同步到 ~/.myyoda/default-experts/templates/）
  - from: default-experts
    to: default-experts
    filter:
      - "**/*"
  # 教程文件（教程查看器 + 欢迎对话使用）
  - from: resources/tutorial.md
    to: tutorial.md
  # 本地化版本历史（更新日志，渲染层离线读取）
  - from: resources/release-notes
    to: release-notes
    filter:
      - "**/*"
  # MyYoda 品牌 Logo 素材（品牌素材下载功能使用）
  - from: resources/logos
    to: logos
    filter:
      - "**/*"
  # Repo Map 资源（tree-sitter 语言查询 + 核心 WASM，Agent 代码库地图注入使用）
  - from: resources/repo-map
    to: repo-map
    filter:
      - "**/*"
  # 默认 Dock 图标（macOS app.dock.setIcon 使用）
  - from: resources/icon.png
    to: icon.png
  # Renderer bundle 载入前显示的静态启动页，避免运行时检测期间出现空白窗口。
  - from: resources/startup-splash
    to: startup-splash
    filter:
      - "**/*"
  # 第三方素材许可证与 Notice（CodeClaw 可选 clawd-on-desk 主题，AGPL-3.0-only）。
  - from: resources/third-party
    to: third-party
    filter:
      - "**/*"

# ============================================
# macOS 配置
# ============================================
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  # EventKit N-API bridge 在 Electron main 进程内执行，确保 TCC 归属 MyYoda.app。
  extraResources:
    - from: resources/eventkit/macos-eventkit.node
      to: eventkit/macos-eventkit.node
  binaries:
    - resources/eventkit/macos-eventkit.node
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "MyYoda 需要访问麦克风，用于将你的语音实时转写为文本。"
    NSCalendarsFullAccessUsageDescription: "MyYoda 需要访问你的日历，以显示、创建和同步你选择的日程。"
    NSRemindersFullAccessUsageDescription: "MyYoda 需要访问你的提醒事项，以同步 Todo 和你选择的列表。"
  # 架构由 CLI 参数控制（CI 矩阵分别传 --arm64 / --x64），
  # 每个 runner 只构建其宿主架构对应的产物，与 bun 按 os/cpu 装好的
  target:
    - dmg
    - zip

# DMG 配置
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# ============================================
# Windows 配置
# ============================================
win:
  icon: resources/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64

# NSIS 安装程序配置
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# ============================================
# Linux 配置
# ============================================
linux:
  icon: resources/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: Development
  maintainer: support@luxshare.com
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

# ============================================
# 发布配置
# 每个平台的 build job 通过 --publish always 直接上传到 GitHub Release。
# releaseType: release —— validate job 已用 gh release create 预创建正式 Release 并写入
# 发布说明；若保持默认 draft 会导致「existing type not compatible」而跳过上传。
# 多架构并行上传时 electron-builder 自动合并 latest-mac.yml。
# ============================================
publish:
  provider: github
  owner: GeoffBao
  repo: MyYoda
  releaseType: release
